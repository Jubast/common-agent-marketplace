name: tag-marketplace

on:
  push:
    branches: [main]
    paths: [.claude-plugin/marketplace.json]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag marketplace version
        run: |
          tag="v$(jq -er .metadata.version .claude-plugin/marketplace.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
